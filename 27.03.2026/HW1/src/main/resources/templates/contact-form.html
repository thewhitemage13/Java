<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title th:text="${formTitle}">Форма контакту</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        form {
            max-width: 400px;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 12px;
        }
        button {
            padding: 8px 14px;
        }
    </style>
</head>
<body>

<h1 th:text="${formTitle}"></h1>

<form th:action="${contact.id == null} ? @{/contacts} : @{/contacts/update/{id}(id=${contact.id})}"
      th:object="${contact}"
      method="post">

    <label>Ім'я:</label>
    <input type="text" th:field="*{firstName}" required>

    <label>Прізвище:</label>
    <input type="text" th:field="*{lastName}" required>

    <label>Телефон:</label>
    <input type="text" th:field="*{phone}" required>

    <button type="submit">Зберегти</button>
</form>

<br>
<a href="/contacts">Назад до списку</a>

</body>
</html>
